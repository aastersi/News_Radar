[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "qmemo-news-radar"
version = "0.1.0"
description = "A small standalone marketing radar for QMemo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6.0,<7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
telegram = ["aiogram>=3.13,<4"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
qmemo-radar = "qmemo_radar.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qmemo_radar"]

[tool.hatch.build]
include = [
  "src/qmemo_radar/**/*.py",
  "src/qmemo_radar/**/*.sql",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls a real external API; runs only when explicitly enabled"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qmemo_radar"]

